name: Build LoRa IPKs (SDK, mipsel_24kc)

on:
  workflow_dispatch:
  push:
    branches: [ openwrt-23.05 ]
    paths:
      - '.github/workflows/sx1302-hal-ipk.yml'
      - 'package/network/sx1302-hal/**'
      - 'package/network/lora-gateway/**'
      - 'package/network/packet-forwarder/**'

jobs:
  build:
    name: Build LoRa packages with ImmortalWrt SDK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: openwrt-23.05

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential libncurses-dev zlib1g-dev \
            gawk gettext libssl-dev xsltproc rsync wget unzip python3 file

      - name: Download ImmortalWrt SDK (ramips/mt7621 23.05-SNAPSHOT)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/23.05-SNAPSHOT/targets/ramips/mt7621/immortalwrt-sdk-23.05-SNAPSHOT-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          wget -q --show-progress "$SDK_URL"
          tar xf immortalwrt-sdk-*.tar.xz
          rm -f immortalwrt-sdk-*.tar.xz
          mv immortalwrt-sdk-* sdk
          echo "SDK_DIR=$(pwd)/sdk" >> "$GITHUB_ENV"

      - name: Copy packages into SDK
        run: |
          mkdir -p "$SDK_DIR/package/network"
          cp -r package/network/lora-gateway    "$SDK_DIR/package/network/"
          cp -r package/network/packet-forwarder "$SDK_DIR/package/network/"
          cp -r package/network/sx1302-hal      "$SDK_DIR/package/network/"
          echo "Packages copied."

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build lora-gateway (SX1301 HAL)
        working-directory: sdk
        run: |
          make defconfig
          make package/network/lora-gateway/compile V=s -j$(nproc)

      - name: Build packet-forwarder (SX1301, depends on lora-gateway)
        working-directory: sdk
        run: |
          make package/network/packet-forwarder/compile V=s -j$(nproc)

      - name: Build sx1302-hal (SX1302/SX1303 HAL + packet forwarder)
        working-directory: sdk
        run: |
          make package/network/sx1302-hal/compile V=s -j$(nproc)

      - name: Collect IPKs
        run: |
          mkdir -p artifacts
          for pkg in lora-gateway packet-forwarder sx1302-hal; do
            ipk=$(find "$SDK_DIR/bin" -name "${pkg}_*.ipk" | head -1)
            if [ -n "$ipk" ]; then
              cp "$ipk" artifacts/
              echo "✅ $pkg: $(basename $ipk)"
            else
              echo "❌ $pkg: IPK not found!"
            fi
          done
          ls -lh artifacts/

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lora-ipks-${{ github.run_number }}
          path: artifacts/*.ipk
          retention-days: 90
