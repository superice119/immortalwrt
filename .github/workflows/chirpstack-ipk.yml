name: Build ChirpStack IPKs (SDK, mipsel_24kc, 24.10)

on:
  workflow_dispatch:
  push:
    branches: [ openwrt-24.10 ]
    paths:
      - '.github/workflows/chirpstack-ipk.yml'

jobs:
  build-chirpstack:
    name: Build ChirpStack IPKs (Rust 1.90, mipsel_24kc)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      - name: Download ImmortalWrt SDK (ramips/mt7621, 24.10)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/ramips/mt7621/immortalwrt-sdk-24.10-SNAPSHOT-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -q --show-progress "$SDK_URL"
          tar --zstd -xf immortalwrt-sdk-*.tar.zst
          rm -f immortalwrt-sdk-*.tar.zst
          mv immortalwrt-sdk-* sdk
          echo "SDK ready. Toolchains: $(ls sdk/staging_dir/)"

      # Cache Rust host toolchain + build stamps: first build ~90 min, subsequent ~0 min
      - name: Restore Rust host toolchain cache
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            sdk/staging_dir/host
            sdk/build_dir/target-mipsel_24kc_musl/host/rustc-1.90.0-src/.prepared
            sdk/build_dir/target-mipsel_24kc_musl/host/rustc-1.90.0-src/.configured
            sdk/build_dir/target-mipsel_24kc_musl/host/rustc-1.90.0-src/.built
          key: sdk-24.10-rust-1.90.0-${{ runner.os }}-v1

      - name: Cache downloaded sources (Rust tarball ~170MB + cargo registry)
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: sdk-24.10-dl-rust-1.90.0-v1
          restore-keys: sdk-24.10-dl-

      - name: Update feeds and fix musl-root
        run: |
          cd sdk
          ./scripts/feeds update -a
          # Fix musl-root: patch Rust Makefile to use hardcoded toolchain path
          # (TOOLCHAIN_ROOT_DIR may be empty when building in SDK context)
          python3 << 'PYEOF'
          import os, glob, sys
          staging = 'staging_dir'
          dirs = sorted(glob.glob(os.path.join(staging, 'toolchain-*')))
          if not dirs:
              print("ERROR: no toolchain-* directory found in staging_dir")
              sys.exit(1)
          toolchain = os.path.join(os.getcwd(), dirs[0])
          libc_a = os.path.join(toolchain, 'lib', 'libc.a')
          print(f"Toolchain: {toolchain}")
          print(f"libc.a exists: {os.path.exists(libc_a)}")
          if not os.path.exists(libc_a):
              found = glob.glob(os.path.join(toolchain, '**/libc.a'), recursive=True)
              if found:
                  toolchain = os.path.dirname(os.path.dirname(found[0]))
                  print(f"Found libc.a, adjusted musl-root to: {toolchain}")
              else:
                  print("WARNING: libc.a not found, proceeding anyway")
          with open('feeds/packages/lang/rust/Makefile') as f:
              content = f.read()
          old = '$(if $(CONFIG_USE_MUSL),--set=target.$(RUSTC_TARGET_ARCH).musl-root=$(TOOLCHAIN_ROOT_DIR))'
          new = '--set=target.$(RUSTC_TARGET_ARCH).musl-root=' + toolchain
          if old in content:
              content = content.replace(old, new)
              with open('feeds/packages/lang/rust/Makefile', 'w') as f:
                  f.write(content)
              print(f"Fixed musl-root -> {toolchain}")
          else:
              print("WARNING: musl-root pattern not found, checking current lines:")
              for line in content.splitlines():
                  if 'musl-root' in line or 'TOOLCHAIN_ROOT' in line:
                      print(f"  {line}")
          PYEOF
          ./scripts/feeds install -a

      - name: Add ChirpStack feed
        run: |
          cd sdk
          echo "src-git chirpstack https://github.com/chirpstack/chirpstack-openwrt-feed.git" \
            >> feeds.conf.default
          ./scripts/feeds update chirpstack
          ./scripts/feeds install -a -p chirpstack
          echo "ChirpStack packages available:"
          ls package/feeds/chirpstack/ 2>/dev/null | head -20

      - name: Configure ChirpStack packages
        run: |
          cd sdk
          cat > .config << 'EOF'
          CONFIG_PACKAGE_libloragw-sx1302=y
          CONFIG_PACKAGE_chirpstack-concentratord=y
          CONFIG_PACKAGE_chirpstack-concentratord-sx1302=y
          CONFIG_PACKAGE_chirpstack-mqtt-forwarder=y
          EOF
          make defconfig 2>&1 | grep -E "chirpstack|libloragw" || true

      - name: Download sources
        run: |
          cd sdk
          make download -j4 2>&1 | grep -E "Download|ERROR|error" | tail -30

      # When Rust host cache hits, create fake .built stamps so make skips recompilation.
      - name: Create Rust build stamps (cache hit — skip 90-min recompile)
        if: steps.cache-rust.outputs.cache-hit == 'true'
        run: |
          STAMP_DIR="sdk/build_dir/target-mipsel_24kc_musl/host/rustc-1.90.0-src"
          mkdir -p "$STAMP_DIR"
          touch "$STAMP_DIR/.prepared" "$STAMP_DIR/.configured" "$STAMP_DIR/.built"
          echo "Rust build stamps created — compile will be skipped"

      # When Rust host cache misses, fix vendor checksums before building
      - name: Prepare Rust source and fix vendor checksums (cache miss only)
        if: steps.cache-rust.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          set -e
          echo "=== Extracting Rust 1.90.0 source (make host/prepare) ==="
          make package/feeds/packages/rust/host/prepare V=s 2>&1 | tail -10
          RUST_SRC=$(find build_dir -maxdepth 5 -name "rustc-1.90.0-src" -type d 2>/dev/null | head -1)
          echo "Rust source: $RUST_SRC"
          if [ -z "$RUST_SRC" ]; then
            echo "ERROR: Rust source directory not found after prepare"
            exit 1
          fi
          echo "=== Fixing vendor checksums (removing missing .orig entries) ==="
          python3 - "$RUST_SRC" << 'PYEOF'
          import json, os, sys, glob
          rust_src = sys.argv[1]
          vendor_dir = os.path.join(rust_src, "vendor")
          if not os.path.isdir(vendor_dir):
              print("No vendor directory found — skipping")
              sys.exit(0)
          fixed_total = 0
          for checksum_file in sorted(glob.glob(os.path.join(vendor_dir, "*", ".cargo-checksum.json"))):
              with open(checksum_file) as f:
                  data = json.load(f)
              missing = []
              for fname in list(data.get("files", {}).keys()):
                  full = os.path.join(os.path.dirname(checksum_file), fname)
                  if not os.path.exists(full):
                      missing.append(fname)
              if missing:
                  for fname in missing:
                      del data["files"][fname]
                  with open(checksum_file, "w") as f:
                      json.dump(data, f)
                  crate = os.path.basename(os.path.dirname(checksum_file))
                  print(f"  {crate}: removed {missing}")
                  fixed_total += len(missing)
          print(f"Fixed {fixed_total} missing checksum entries across vendor/")
          PYEOF

      - name: Build libloragw-sx1302
        run: |
          cd sdk
          make package/feeds/chirpstack/libloragw-sx1302/compile \
            -j$(nproc) V=s > /tmp/libloragw.log 2>&1
          rc=$?; tail -20 /tmp/libloragw.log
          [ $rc -eq 0 ] || { tail -100 /tmp/libloragw.log; exit 1; }

      - name: Build chirpstack-concentratord (Rust cross-compile ~90 min first time)
        shell: bash
        run: |
          set +e
          cd sdk
          echo "Cache hit for Rust host: ${{ steps.cache-rust.outputs.cache-hit }}"
          make package/feeds/chirpstack/chirpstack-concentratord/compile \
            -j$(nproc) V=s > /tmp/concentratord.log 2>&1
          rc=$?
          tail -100 /tmp/concentratord.log
          if [ $rc -ne 0 ]; then
            echo "::error::concentratord parallel build failed (exit $rc), retrying single-job..."
            make package/feeds/chirpstack/chirpstack-concentratord/compile \
              -j1 V=s 2>&1 | tail -300
            exit 1
          fi

      - name: Build chirpstack-mqtt-forwarder
        shell: bash
        run: |
          set +e
          cd sdk
          make package/feeds/chirpstack/chirpstack-mqtt-forwarder/compile \
            -j$(nproc) V=s > /tmp/mqtt-forwarder.log 2>&1
          rc=$?; tail -50 /tmp/mqtt-forwarder.log
          if [ $rc -ne 0 ]; then
            echo "::error::mqtt-forwarder build failed (exit $rc), retrying..."
            make package/feeds/chirpstack/chirpstack-mqtt-forwarder/compile \
              -j1 V=s 2>&1 | tail -200
            exit 1
          fi

      - name: Collect ChirpStack IPKs
        run: |
          mkdir -p chirpstack-pkgs
          find sdk/bin -name "*.ipk" | grep -E "chirpstack|libloragw" \
            | xargs -I{} cp {} chirpstack-pkgs/ 2>/dev/null || true
          echo "--- ChirpStack IPKs (24.10, mipsel_24kc) ---"
          ls -lh chirpstack-pkgs/

      - name: Upload ChirpStack IPKs
        uses: actions/upload-artifact@v4
        with:
          name: chirpstack-pkgs-24.10-${{ github.run_number }}
          path: chirpstack-pkgs/
          retention-days: 90
