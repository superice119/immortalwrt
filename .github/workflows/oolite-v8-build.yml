name: Build ImmortalWrt for GainStrong Oolite V8

on:
  push:
    branches: [ openwrt-23.05 ]
    paths:
      - '.github/workflows/oolite-v8-build.yml'
      - '.github/patches/**'
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt (ramips/mt7621 Oolite V8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo (patches)
        uses: actions/checkout@v4
        with:
          ref: openwrt-23.05
          path: meta

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt openwrt-23.05
        run: |
          git clone --depth=1 -b openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "ImmortalWrt: $(git -C openwrt rev-parse --short HEAD)"

      - name: Apply DTS for Oolite V8
        run: |
          cp meta/.github/patches/001-mt7621_gainstrong_oolite-v8.dts \
             openwrt/target/linux/ramips/dts/mt7621_gainstrong_oolite-v8.dts
          echo "DTS installed."

      - name: Patch mt7621.mk - Add Oolite V8 device entry
        run: |
          cd openwrt
          python3 ../meta/.github/patches/002-patch-mt7621-mk.py
          grep -A6 "gainstrong_oolite-v8" target/linux/ramips/image/mt7621.mk | head -8

      - name: Apply kernel patch - 32MB NOR flash reboot fix
        run: |
          cp meta/.github/patches/003-spi-nor-restore-4byte.patch \
             openwrt/target/linux/ramips/patches-5.15/499-spi-nor-restore-4byte.patch
          echo "Kernel patch installed."

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cp meta/.github/patches/004-dot-config openwrt/.config
          cd openwrt
          make defconfig 2>&1 | tail -5
          echo "Target:"
          grep "DEVICE_gainstrong" .config

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -delete

      - name: Build firmware
        run: |
          cd openwrt
          if ! make -j$(nproc); then
            echo "Parallel build failed, retrying with verbose single-job..."
            make -j1 V=s 2>&1 | tail -150
            exit 1
          fi

      - name: Collect firmware
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/ramips/mt7621/ -name "*.bin" -exec cp {} firmware/ \;
          ls -lh firmware/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-oolite-v8-${{ github.run_number }}
          path: firmware/
          retention-days: 30

      - name: Build ath10k + pciutils packages (kernel already compiled)
        run: |
          cd openwrt
          # Append package selections without modifying 004-dot-config
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_kmod-ath10k-ct=y
          CONFIG_PACKAGE_ath10k-firmware-qca988x-ct=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_libpci=y
          CONFIG_PACKAGE_pciids=y
          CONFIG_PACKAGE_kmod=y
          CONFIG_PACKAGE_libkmod=y
          EOF
          make defconfig 2>&1 | grep -E "ath10k|pciutils|libpci|pciids|libkmod" || true
          # Download sources
          make package/kmod-ath10k-ct/download V=s 2>&1 | tail -5
          make package/ath10k-ct-firmware/download V=s 2>&1 | tail -5
          make package/pciutils/download V=s 2>&1 | tail -5
          make package/kmod/download V=s 2>&1 | tail -5 || true
          # Compile (kernel already built, kmod compile is fast)
          make package/kmod-ath10k-ct/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/ath10k-ct-firmware/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/pciutils/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/kmod/compile V=s -j$(nproc) 2>&1 | tail -20 || true

      - name: Collect extra IPKs
        run: |
          mkdir -p extra-pkgs
          # Search both packages and targets trees
          for name in kmod-ath10k-ct ath10k-firmware-qca988x-ct \
                      pciutils libpci pciids kmod libkmod; do
            find openwrt/bin -name "${name}_*.ipk" -exec cp {} extra-pkgs/ \; 2>/dev/null || true
          done
          echo "--- Collected packages ---"
          ls -lh extra-pkgs/

      - name: Upload extra packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: oolite-v8-extra-pkgs-${{ github.run_number }}
          path: extra-pkgs/
          retention-days: 30
