name: Build ImmortalWrt for GainStrong Oolite V8

on:
  push:
    branches: [ openwrt-23.05 ]
    paths:
      - '.github/workflows/oolite-v8-build.yml'
      - '.github/patches/**'
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt (ramips/mt7621 Oolite V8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo (patches)
        uses: actions/checkout@v4
        with:
          ref: openwrt-23.05
          path: meta

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt openwrt-23.05
        run: |
          git clone --depth=1 -b openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "ImmortalWrt: $(git -C openwrt rev-parse --short HEAD)"

      - name: Apply DTS for Oolite V8
        run: |
          cp meta/.github/patches/001-mt7621_gainstrong_oolite-v8.dts \
             openwrt/target/linux/ramips/dts/mt7621_gainstrong_oolite-v8.dts
          echo "DTS installed."

      - name: Patch mt7621.mk - Add Oolite V8 device entry
        run: |
          cd openwrt
          python3 ../meta/.github/patches/002-patch-mt7621-mk.py
          grep -A6 "gainstrong_oolite-v8" target/linux/ramips/image/mt7621.mk | head -8

      - name: Apply kernel patch - 32MB NOR flash reboot fix
        run: |
          cp meta/.github/patches/003-spi-nor-restore-4byte.patch \
             openwrt/target/linux/ramips/patches-5.15/499-spi-nor-restore-4byte.patch
          echo "Kernel patch installed."

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # Upgrade Rust to 1.90.0 (openwrt-24.10 validated version, supports edition=2024 let-chains)
          RUST_MK=feeds/packages/lang/rust/Makefile
          sed -i 's/PKG_VERSION:=1\.85\.0/PKG_VERSION:=1.90.0/' "$RUST_MK"
          # Change source extension from .tar.gz to .tar.xz (1.85→1.88+ uses .tar.xz)
          sed -i 's|rustc-\$(PKG_VERSION)-src\.tar\.gz|rustc-$(PKG_VERSION)-src.tar.xz|' "$RUST_MK"
          # Update hash to openwrt-24.10 verified SHA256 for rustc-1.90.0-src.tar.xz
          sed -i 's|PKG_HASH:=.*|PKG_HASH:=6bfeaddd90ffda2f063492b092bfed925c4b8c701579baf4b1316e021470daac|' "$RUST_MK"
          echo "Rust Makefile after patch:"
          grep -E "PKG_VERSION|PKG_SOURCE:|PKG_HASH" "$RUST_MK"
          # Replace 0001 patch with openwrt-24.10 version (sysinfo "0.36.0" matches 1.90.0)
          # Remove old incompatible patches; 0003 does not exist in 24.10
          rm -f feeds/packages/lang/rust/patches/0001-Update-xz2-and-use-it-static.patch
          rm -f feeds/packages/lang/rust/patches/0003-bump-libc-deps-to-0.2.146.patch
          curl -fsSL -o feeds/packages/lang/rust/patches/0001-Update-xz2-and-use-it-static.patch \
            https://raw.githubusercontent.com/openwrt/packages/openwrt-24.10/lang/rust/patches/0001-Update-xz2-and-use-it-static.patch
          echo "Rust patches after update:"
          ls feeds/packages/lang/rust/patches/
          head -5 feeds/packages/lang/rust/patches/0001-Update-xz2-and-use-it-static.patch
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cp meta/.github/patches/004-dot-config openwrt/.config
          cd openwrt
          make defconfig 2>&1 | tail -5
          echo "Target:"
          grep "DEVICE_gainstrong" .config

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -delete

      - name: Build firmware
        run: |
          cd openwrt
          if ! make -j$(nproc); then
            echo "Parallel build failed, retrying with verbose single-job..."
            make -j1 V=s 2>&1 | tail -150
            exit 1
          fi

      - name: Collect firmware
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/ramips/mt7621/ -name "*.bin" -exec cp {} firmware/ \;
          ls -lh firmware/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-oolite-v8-${{ github.run_number }}
          path: firmware/
          retention-days: 30

      - name: Build ath10k + pciutils packages (kernel already compiled)
        run: |
          cd openwrt
          # Full dependency chain for ath10k-ct + pciutils
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_PACKAGE_kmod-ath10k-ct=y
          CONFIG_PACKAGE_ath10k-board-qca988x=y
          CONFIG_PACKAGE_ath10k-firmware-qca988x-ct=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_libpci=y
          CONFIG_PACKAGE_pciids=y
          CONFIG_PACKAGE_kmod=y
          CONFIG_PACKAGE_libkmod=y
          EOF
          make defconfig 2>&1 | grep -E "ath10k|pciutils|mac80211|libkmod" || true
          # Download sources
          make package/mac80211/download V=s 2>&1 | tail -5
          make package/ath10k-ct/download V=s 2>&1 | tail -5
          make package/ath10k-ct-firmware/download V=s 2>&1 | tail -5
          make package/pciutils/download V=s 2>&1 | tail -5
          make package/kmod/download V=s 2>&1 | tail -5 || true
          # Compile (kernel already built)
          make package/mac80211/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/ath10k-ct/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/ath10k-ct-firmware/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/pciutils/compile V=s -j$(nproc) 2>&1 | tail -20
          make package/kmod/compile V=s -j$(nproc) 2>&1 | tail -20 || true

      - name: Collect extra IPKs
        run: |
          mkdir -p extra-pkgs
          for name in kmod-mac80211 kmod-cfg80211 kmod-ath \
                      kmod-ath10k-ct ath10k-board-qca988x ath10k-firmware-qca988x-ct \
                      pciutils libpci pciids kmod libkmod; do
            find openwrt/bin -name "${name}_*.ipk" -exec cp {} extra-pkgs/ \; 2>/dev/null || true
          done
          echo "--- Collected packages ---"
          ls -lh extra-pkgs/

      - name: Upload extra packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: oolite-v8-extra-pkgs-${{ github.run_number }}
          path: extra-pkgs/
          retention-days: 30

      # ── ChirpStack packages (WM1302-USB-915, SX1302) ────────────────────────

      - name: Add ChirpStack feed
        run: |
          cd openwrt
          echo "src-git chirpstack https://github.com/chirpstack/chirpstack-openwrt-feed.git" \
            >> feeds.conf.default
          ./scripts/feeds update chirpstack
          ./scripts/feeds install -a -p chirpstack
          echo "Feed installed. Packages available:"
          ls package/feeds/chirpstack/ | head -20

      - name: Configure ChirpStack packages (SX1302/USB)
        run: |
          cd openwrt
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_libloragw-sx1302=y
          CONFIG_PACKAGE_libloragw-sx1302-utils=y
          CONFIG_PACKAGE_libloragw-sx1301=y
          CONFIG_PACKAGE_libloragw-2g4=y
          CONFIG_PACKAGE_chirpstack-concentratord=y
          CONFIG_PACKAGE_chirpstack-concentratord-sx1302=y
          CONFIG_PACKAGE_chirpstack-mqtt-forwarder=y
          CONFIG_PACKAGE_chirpstack-mqtt-forwarder-single=y
          CONFIG_PACKAGE_chirpstack-udp-forwarder=y
          CONFIG_PACKAGE_chirpstack-udp-forwarder-single=y
          EOF
          make defconfig 2>&1 | grep -E "chirpstack|libloragw" || true

      - name: Free disk space before ChirpStack build
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          rm -rf openwrt/build_dir/target-mipsel_24kc_musl/root-ramips || true
          df -h

      - name: Build libloragw (SX1302 + build deps for concentratord)
        run: |
          cd openwrt
          make package/feeds/chirpstack/libloragw-sx1302/compile \
            -j$(nproc) V=s > /tmp/libloragw.log 2>&1
          rc=$?; tail -30 /tmp/libloragw.log
          [ $rc -eq 0 ] || { make package/feeds/chirpstack/libloragw-sx1302/compile \
            -j1 V=s 2>&1 | tail -100; exit 1; }
          # SX1301 and 2g4 are optional concentratord build deps - ignore failures
          make package/feeds/chirpstack/libloragw-sx1301/compile -j$(nproc) V=s \
            > /dev/null 2>&1 || true
          make package/feeds/chirpstack/libloragw-2g4/compile -j$(nproc) V=s \
            > /dev/null 2>&1 || true

      - name: Build chirpstack-concentratord (Rust, mipsel_24kc, SX1302)
        shell: bash
        run: |
          set +e  # override GitHub Actions -e flag so we can capture and show logs on failure
          cd openwrt
          make package/feeds/chirpstack/chirpstack-concentratord/compile \
            -j$(nproc) V=s > /tmp/concentratord.log 2>&1
          rc=$?
          tail -80 /tmp/concentratord.log
          if [ $rc -ne 0 ]; then
            echo "::error::Parallel concentratord build failed (exit $rc), retrying single-job..."
            make package/feeds/chirpstack/chirpstack-concentratord/compile \
              -j1 V=s 2>&1 | tail -300
            exit 1
          fi

      - name: Build ChirpStack forwarders (MQTT + UDP, Rust)
        shell: bash
        run: |
          set +e  # override GitHub Actions -e flag so we can capture and show logs on failure
          cd openwrt
          for pkg in \
            chirpstack-mqtt-forwarder \
            chirpstack-mqtt-forwarder-single \
            chirpstack-udp-forwarder \
            chirpstack-udp-forwarder-single; do
            echo "=== Building $pkg ==="
            make package/feeds/chirpstack/$pkg/compile \
              -j$(nproc) V=s > /tmp/${pkg}.log 2>&1
            rc=$?
            tail -50 /tmp/${pkg}.log
            if [ $rc -ne 0 ]; then
              echo "::error::Parallel $pkg build failed (exit $rc), retrying single-job..."
              make package/feeds/chirpstack/$pkg/compile -j1 V=s 2>&1 | tail -200
              exit 1
            fi
          done

      - name: Collect ChirpStack IPKs
        run: |
          mkdir -p chirpstack-pkgs
          for name in \
            libloragw-sx1302 libloragw-sx1302-utils \
            chirpstack-concentratord chirpstack-concentratord-sx1302 \
            chirpstack-mqtt-forwarder chirpstack-mqtt-forwarder-single \
            chirpstack-udp-forwarder chirpstack-udp-forwarder-single; do
            find openwrt/bin -name "${name}_*.ipk" \
              -exec cp {} chirpstack-pkgs/ \; 2>/dev/null || true
          done
          echo "--- ChirpStack packages (WM1302-USB-915) ---"
          ls -lh chirpstack-pkgs/

      - name: Upload ChirpStack packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: chirpstack-pkgs-${{ github.run_number }}
          path: chirpstack-pkgs/
          retention-days: 30
